<!DOCTYPE html>
<html lang="pt-br"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Criar Ninja</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>
<main class="container">
<h1>Criar Ninja</h1>


<form th:action="@{/web/ninjas/novo}"
      th:object="${ninja}"
      method="post"
      class="formulario">

    <div class="form-grupo">
        <label>Nome:</label>
        <input type="text" th:field="*{nome}">
    </div>

    <div class="form-grupo">
        <label>Email:</label>
        <input type="text" th:field="*{email}">
    </div>

    <div class="form-grupo">
        <label>Idade:</label>
        <input type="text" th:field="*{idade}">
    </div>

    <div class="form-grupo">
        <label>Rank:</label>
        <input type="text" th:field="*{rank}">
    </div>

    <div class="form-grupo">
        <label>Imagem:</label>
        <input type="text" th:field="*{imUrl}">
    </div>

    <div class="form-grupo">
        <label>Missão:</label>

        <select name="missaoId">
            <option value="">Sem missão</option>

            <option th:each="missao : ${missoes}"
                    th:value="${missao.id}"
                    th:text="${missao.nome}">
            </option>
        </select>
    </div>

    <div class="form-acoes">
        <button type="submit">Criar</button>
        <a th:href="@{/web/ninjas}">Voltar para Ninjas</a>
    </div>

</form>
</main>

</body>
</html>
