<!DOCTYPE html>
<html lang="pt-br"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Detalhes do Ninja</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>
<main class="container">
<h1>Detalhes do Ninja</h1>


<img th:src="${ninja.imUrl}"
     th:alt="${ninja.nome}">
<p>
    <strong>Nome:</strong>
    <span th:text="${ninja.nome}"></span>
</p>
<p>
    <strong>Email:</strong>
    <span th:text="${ninja.email}"></span>
</p>
<p>
    <strong>Idade:</strong>
    <span th:text="${ninja.idade}"></span>
</p>
<p>
    <strong>Rank:</strong>
    <span th:text="${ninja.rank}"></span>
</p>
<p>
    <strong>Missão:</strong>
    <span th:text="${ninja.missoes != null ? ninja.missoes.nome : 'Sem missão'}"></span>
</p>
<a th:href="@{/web/ninjas}">Voltar</a>
</main>
</body>
</html>
