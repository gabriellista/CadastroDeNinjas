<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Criar Missoes</title>
</head>
<body>
<form th:object="${missao}"
      method="post"
      th:action="@{/web/missoes/nova}">

    <label>Nome:</label>
    <input type="text" th:field="*{nome}">

    <label>Dificuldade:</label>
    <input type="text" th:field="*{dificuldade}">

    <button type="submit">Criar</button>

</form>
</body>
</html>
